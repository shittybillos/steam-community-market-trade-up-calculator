name: Release extension

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches manifest
        run: node -e 'const m=require("./manifest.json"); if(process.env.GITHUB_REF_NAME!=="v"+m.version) process.exit(1);'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package extension
        run: |
          mkdir -p release
          cd dist
          zip -r "../release/steam-community-market-trade-up-calculator-${GITHUB_REF_NAME}.zip" .
      - name: Publish downloadable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/steam-community-market-trade-up-calculator-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Steam Community Market Trade-up Calculator $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
